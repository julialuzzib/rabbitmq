version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: restaurante_rabbitmq
    ports:
      - "5672:5672"   # Porta para envio e recebimento de mensagens (AMQP)
      - "15672:15672" # Porta para a Interface Web Administrativa
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

volumes:
  rabbitmq_data: